<!-- UBOVM STARTUP BEGIN -->
<style id="ubovm-startup-style">
  html, body { margin: 0; background: var(--ubovm-startup-bg, #F6F7F9); }
  #ubovm-startup {
    position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
    overflow: hidden; background: var(--ubovm-startup-bg, #F6F7F9); color: var(--ubovm-startup-fg, #17191E);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    transition: opacity 180ms cubic-bezier(.22, 1, .36, 1), visibility 180ms;
  }
  #ubovm-startup::before {
    content: ""; position: absolute; inset: 0 0 auto; height: 44px; -webkit-app-region: drag;
  }
  #ubovm-startup .startup-card {
    display: flex; align-items: center; flex-direction: column; transform: translateY(-16px);
    animation: ubovm-startup-enter 480ms cubic-bezier(.22, 1, .36, 1) both;
  }
  #ubovm-startup .startup-mark {
    display: grid; place-items: center; width: 72px; height: 72px;
    border: 1px solid var(--ubovm-startup-border, #E4E7EC);
    border-radius: 22px; background: var(--ubovm-startup-card, #FFFFFF);
    box-shadow: 0 1px 2px color-mix(in srgb, var(--ubovm-startup-fg, #17191E) 4%, transparent), 0 6px 22px color-mix(in srgb, var(--ubovm-startup-fg, #17191E) 5%, transparent);
    animation: ubovm-startup-breathe 2.8s ease-in-out 480ms infinite;
    will-change: transform;
  }
  #ubovm-startup svg { width: 36px; height: 36px; fill: currentColor; stroke: none; }
  #ubovm-startup .startup-name {
    margin: 23px 0 0; font-size: 14px; font-weight: 600; letter-spacing: 3px; padding-left: 3px;
    animation: ubovm-startup-fade 520ms cubic-bezier(.22, 1, .36, 1) 80ms both;
  }
  #ubovm-startup .startup-caption {
    margin: 11px 0 0; font-size: 12px; color: var(--ubovm-startup-muted, #6E7787); letter-spacing: .4px;
    animation: ubovm-startup-fade 520ms cubic-bezier(.22, 1, .36, 1) 140ms both, ubovm-startup-caption 2.2s ease-in-out 700ms infinite;
  }
  #ubovm-startup .startup-track {
    margin-top: 29px; width: 110px; height: 2px; overflow: hidden; border-radius: 999px;
    background: var(--ubovm-startup-track, #E9EDF3);
    animation: ubovm-startup-fade 520ms cubic-bezier(.22, 1, .36, 1) 200ms both;
  }
  /* Safety valve: normally the splash is removed in under a second. If the
   * workbench never reaches first paint, let the user reload instead of being
   * trapped on the brand page forever. */
  #ubovm-startup .startup-retry {
    margin-top: 18px; color: var(--ubovm-startup-muted, #6E7787); font-size: 11px;
    text-decoration: none; opacity: 0; visibility: hidden;
    animation: ubovm-startup-retry 0s linear 18s forwards;
  }
  #ubovm-startup .startup-retry:hover { color: var(--ubovm-startup-fg, #17191E); text-decoration: underline; }
  @keyframes ubovm-startup-retry { to { opacity: .85; visibility: visible; } }
  #ubovm-startup .startup-track::after {
    content: ""; display: block; width: 42%; height: 100%; border-radius: inherit;
    background: linear-gradient(90deg, transparent, var(--ubovm-startup-bar, #4C63C7) 28%, var(--ubovm-startup-bar, #4C63C7) 72%, transparent);
    animation: ubovm-startup-progress 900ms cubic-bezier(.4, 0, .2, 1) infinite;
    will-change: transform;
  }
  #ubovm-startup.ubovm-startup-exit { opacity: 0; visibility: hidden; pointer-events: none; }
  #ubovm-startup.ubovm-startup-exit .startup-card {
    animation: ubovm-startup-leave 180ms cubic-bezier(.4, 0, 1, 1) both;
  }
  @keyframes ubovm-startup-enter {
    from { opacity: 0; transform: translateY(-8px) scale(.985); }
    to { opacity: 1; transform: translateY(-16px) scale(1); }
  }
  @keyframes ubovm-startup-leave {
    from { opacity: 1; transform: translateY(-16px) scale(1); }
    to { opacity: 0; transform: translateY(-22px) scale(.99); }
  }
  @keyframes ubovm-startup-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes ubovm-startup-caption { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }
  @keyframes ubovm-startup-breathe {
    0%, 100% { transform: translateY(0) scale(1); box-shadow: 0 1px 2px color-mix(in srgb, var(--ubovm-startup-fg, #17191E) 4%, transparent), 0 6px 22px color-mix(in srgb, var(--ubovm-startup-fg, #17191E) 5%, transparent); }
    50% { transform: translateY(-4px) scale(1.025); box-shadow: 0 2px 4px color-mix(in srgb, var(--ubovm-startup-fg, #17191E) 5%, transparent), 0 10px 28px color-mix(in srgb, var(--ubovm-startup-fg, #17191E) 8%, transparent); }
  }
  @keyframes ubovm-startup-progress { from { transform: translateX(-120%); } to { transform: translateX(260%); } }
  @media (prefers-color-scheme: dark) {
    html, body { background: var(--ubovm-startup-bg, #131417); }
    #ubovm-startup {
      background: var(--ubovm-startup-bg, #131417); color: var(--ubovm-startup-fg, #E8EBF0);
    }
    #ubovm-startup .startup-mark {
      border-color: var(--ubovm-startup-border, #2A2E35);
      background: var(--ubovm-startup-card, #17191D);
      box-shadow: 0 1px 2px color-mix(in srgb, #000 22%, transparent), 0 6px 22px color-mix(in srgb, #000 35%, transparent);
    }
    #ubovm-startup .startup-caption { color: var(--ubovm-startup-muted, #8A92A0); }
    #ubovm-startup .startup-retry { color: var(--ubovm-startup-muted, #8A92A0); }
    #ubovm-startup .startup-retry:hover { color: var(--ubovm-startup-fg, #E8EBF0); }
    #ubovm-startup .startup-track { background: var(--ubovm-startup-track, #2A2E35); }
    #ubovm-startup .startup-track::after {
      background: linear-gradient(90deg, transparent, var(--ubovm-startup-bar, #9FB1D6) 28%, var(--ubovm-startup-bar, #9FB1D6) 72%, transparent);
    }
    @keyframes ubovm-startup-breathe {
      0%, 100% { transform: translateY(0) scale(1); box-shadow: 0 1px 2px color-mix(in srgb, #000 22%, transparent), 0 6px 22px color-mix(in srgb, #000 35%, transparent); }
      50% { transform: translateY(-4px) scale(1.025); box-shadow: 0 3px 6px color-mix(in srgb, #000 30%, transparent), 0 12px 30px color-mix(in srgb, #000 48%, transparent); }
    }
  }
  @media (prefers-reduced-motion: reduce) {
    #ubovm-startup, #ubovm-startup * , #ubovm-startup *::after { animation: none !important; transition: none !important; }
    #ubovm-startup .startup-card { transform: translateY(-16px); opacity: 1; }
    #ubovm-startup .startup-track::after { width: 100%; opacity: .4; background: var(--ubovm-startup-bar, #4C63C7); }
  }
</style>
<div id="ubovm-startup" role="status" aria-live="polite" aria-label="正在打开工作空间">
  <div class="startup-card">
    <div class="startup-mark" aria-hidden="true">{{PRODUCT_LOGO}}</div>
    <div class="startup-name" aria-hidden="true">UBOVM</div>
    <div class="startup-caption">正在打开工作空间</div>
    <div class="startup-track" aria-hidden="true"></div>
    <a class="startup-retry" href="">长时间未进入？重新加载</a>
  </div>
</div>
<!-- UBOVM STARTUP END -->
