<!-- UBOVM STARTUP BEGIN -->
<style id="ubovm-startup-style">
  html, body { margin: 0; background: #f7f7f5; }
  #ubovm-startup {
    position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
    overflow: hidden; background: #f7f7f5; color: #252626;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    transition: opacity 260ms cubic-bezier(.22, 1, .36, 1), visibility 260ms;
  }
  #ubovm-startup::before {
    content: ""; position: absolute; inset: 0 0 auto; height: 44px; -webkit-app-region: drag;
  }
  #ubovm-startup .startup-card {
    display: flex; align-items: center; flex-direction: column; transform: translateY(-16px);
  }
  #ubovm-startup .startup-mark {
    display: grid; place-items: center; width: 72px; height: 72px; border: 1px solid #e5e5e1;
    border-radius: 22px; background: #fff; box-shadow: 0 5px 20px #27282405;
  }
  #ubovm-startup svg { width: 36px; height: 36px; fill: currentColor; stroke: none; }
  #ubovm-startup .startup-name { margin: 23px 0 0; font-size: 14px; font-weight: 600; letter-spacing: 3px; padding-left: 3px; }
  #ubovm-startup .startup-caption { margin: 11px 0 0; font-size: 12px; color: #8c8e89; letter-spacing: .4px; }
  #ubovm-startup .startup-track { margin-top: 29px; width: 110px; height: 2px; overflow: hidden; border-radius: 4px; background: #e6e7e2; }
  #ubovm-startup .startup-track::after {
    content: ""; display: block; width: 40px; height: 100%; border-radius: inherit; background: #656a60;
    animation: ubovm-startup-progress 1500ms ease-in-out infinite;
  }
  #ubovm-startup.ubovm-startup-exit { opacity: 0; visibility: hidden; pointer-events: none; }
  @keyframes ubovm-startup-breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes ubovm-startup-progress { from { transform: translateX(-40px); } to { transform: translateX(110px); } }
  @media (prefers-reduced-motion: reduce) {
    #ubovm-startup, #ubovm-startup * , #ubovm-startup *::after { animation: none !important; transition: none !important; }
    #ubovm-startup .startup-track::after { width: 100%; opacity: .4; }
  }
</style>
<div id="ubovm-startup" role="status" aria-live="polite" aria-label="正在打开工作空间">
  <div class="startup-card">
    <div class="startup-mark" aria-hidden="true">{{PRODUCT_LOGO}}</div>
    <div class="startup-name" aria-hidden="true">UBOVM</div>
    <div class="startup-caption">正在打开工作空间</div>
    <div class="startup-track" aria-hidden="true"></div>
  </div>
</div>
<!-- UBOVM STARTUP END -->
